project_id = "pgavedcbyrifjolcuhbr"

# O "tradutor de IA" é chamado pelo app logado. Exige JWT do Supabase Auth
# (Etapa B) — só usuário autenticado chama, evitando abuso de custo de IA.
[functions.processar]
verify_jwt = true

# Webhook do bot do Telegram (chamado pelo Telegram, sem login Supabase).
# A própria função valida o header secret do Telegram.
[functions.telegram]
verify_jwt = false

# Backup automático (chamado pelo agendador pg_cron, sem login Supabase).
# A própria função valida o header X-Backup-Secret.
[functions.backup]
verify_jwt = false
